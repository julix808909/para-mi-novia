<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Novia ❤️</title>
    <style>
        /* Fondo oscuro romántico para que resalten las luces del árbol */
        body {
            margin: 0;
            padding: 20px;
            background-color: #0b010a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #ff65a3;
            overflow-x: hidden;
            position: relative;
        }

        h1 {
            font-size: 2rem;
            margin: 10px 0 5px 0;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 101, 163, 0.6);
            z-index: 10;
        }

        /* Contador Principal estilo Neón */
        .contador-principal {
            background: rgba(20, 2, 18, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(255, 101, 163, 0.2);
            border: 1px solid rgba(255, 101, 163, 0.3);
            text-align: center;
            z-index: 10;
            color: #fff;
        }

        /* Contenedor del Árbol de código interactivo */
        #contenedor-arbol {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 350px;
            margin-bottom: 20px;
            z-index: 5;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* MARCO POLAROID VINTAGE */
        .marco-foto {
            background: #ffffff;
            padding: 15px 15px 35px 15px;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 290px;
            width: 80%;
            text-align: center;
            transform: rotate(-2deg);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 10;
        }

        .marco-foto::before {
            content: "";
            position: absolute;
            top: -15px;
            left: 35%;
            width: 80px;
            height: 25px;
            background-color: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(2px);
            transform: rotate(-5deg);
            border-left: 2px dashed rgba(0,0,0,0.1);
            border-right: 2px dashed rgba(0,0,0,0.1);
        }

        .marco-foto:hover {
            transform: rotate(0deg) scale(1.04);
            box-shadow: 0 15px 40px rgba(255, 101, 163, 0.3);
        }

        .marco-foto img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            border-radius: 1px;
            background-color: #222;
        }

        .texto-foto {
            margin-top: 15px;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 1.05rem;
            color: #333;
            line-height: 1.3;
        }

        .contador-foto {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #666;
            border-top: 1px dotted #ffccd5;
            padding-top: 8px;
        }

        /* BOTÓN GLOW */
        .btn-cambiar {
            margin-top: 25px;
            background: linear-gradient(135deg, #ff65a3 0%, #d63384 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(214, 51, 132, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .btn-cambiar:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 101, 163, 0.7);
        }

        /* Corazones flotantes que van por detrás en toda la web */
        .corazon-flotante {
            position: absolute;
            color: rgba(255, 101, 163, 0.15);
            pointer-events: none;
            font-size: 20px;
            animation: subirCorazon 6s linear infinite;
            z-index: 1;
        }

        @keyframes subirCorazon {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>Llevamos Juntos:</h1>
    <div class="contador-principal" id="tiempoJuntos">Calculando tiempo...</div>
    
    <!-- ÁRBOL GENERADO EN TIEMPO REAL -->
    <div id="contenedor-arbol">
        <canvas id="canvasArbol"></canvas>
    </div>

    <!-- MARCO DIGITAL -->
    <div class="marco-foto">
        <img id="fotoNovia" src="" alt="Nuestro momento">
        <div id="textoNovia" class="texto-foto">Cargando recuerdo...</div>
        <div id="tiempoFoto" class="contador-foto"></div>
    </div>

    <button class="btn-cambiar" onclick="mostrarRecuerdoAleatorio()">Ver otro recuerdo ✨</button>

    <script>
        // ==========================================
        // CONFIGURACIÓN 1: TU FECHA DE ANIVERSARIO
        // ==========================================
        const fechaInicioRelacion = new Date("2024-05-15T00:00:00"); 

        // ==========================================
        // CONFIGURACIÓN 2: TUS FOTOS Y RUTAS
        // ==========================================
        const recuerdos = [
            {
                url: "./imagenes/mcdonalds.png", // Asegúrate que esté idéntico a tu archivo
                texto: "La foto de hoy es... de cuando fuimos al McDonalds 🍦",
                fechaFoto: new Date("2024-07-20T16:30:00")
            },
            {
                url: "./imagenes/foto2.png", 
                texto: "Esta foto fue hace... en nuestro viaje favorito ✈️",
                fechaFoto: new Date("2025-01-10T12:00:00")
            }
        ];

        let recuerdoActual = null;

        // --- RELOJES Y CONTADORES ---
        function calcularTiempoTranscurrido(fechaPasada) {
            const ahora = new Date();
            const diferenciaMs = ahora - fechaPasada;
            if (diferenciaMs < 0) return "¡Fecha en el futuro!";
            const dias = Math.floor(diferenciaMs / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferenciaMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferenciaMs % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diferenciaMs % (1000 * 60)) / 1000);
            return `${dias} días, ${horas}h, ${minutos}m y ${segundos}s`;
        }

        function actualizarContadores() {
            document.getElementById("tiempoJuntos").innerText = calcularTiempoTranscurrido(fechaInicioRelacion);
            if (recuerdoActual && recuerdoActual.fechaFoto) {
                document.getElementById("tiempoFoto").innerText = `📸 Esta foto fue hace: ${calcularTiempoTranscurrido(recuerdoActual.fechaFoto)}`;
            }
        }

        function mostrarRecuerdoAleatorio() {
            const indiceAleatorio = Math.floor(Math.random() * recuerdos.length);
            recuerdoActual = recuerdos[indiceAleatorio];
            document.getElementById('fotoNovia').src = recuerdoActual.url;
            document.getElementById('textoNovia').innerText = recuerdoActual.texto;
            actualizarContadores();
        }

        // --- EFECTO: CORAZONES DE FONDO FLOTANTES ---
        function crearCorazonFondo() {
            const corazon = document.createElement('div');
            corazon.classList.add('corazon-flotante');
            corazon.innerText = ['❤️','💖','💝','💕'][Math.floor(Math.random()*4)];
            corazon.style.left = Math.random() * 100 + 'vw';
            corazon.style.animationDuration = Math.random() * 3 + 4 + 's';
            corazon.style.fontSize = Math.random() * 15 + 15 + 'px';
            document.body.appendChild(corazon);
            setTimeout(() => { corazon.remove(); }, 6000);
        }
        setInterval(crearCorazonFondo, 400);

        // --- EFECTO: EL ÁRBOL DE TIKTOK (Fractal con Hojas Corazón) ---
        const canvas = document.getElementById('canvasArbol');
        const ctx = canvas.getContext('2d');

        function redimensionarCanvas() {
            const contenedor = document.getElementById('contenedor-arbol');
            canvas.width = contenedor.clientWidth;
            canvas.height = contenedor.clientHeight;
        }

        function dibujarArbol(startX, startY, len, angle, branchWidth) {
            ctx.beginPath();
            ctx.save();
            ctx.strokeStyle = "#4a2c40"; // Color del tronco madera oscuro
            ctx.lineWidth = branchWidth;
            ctx.translate(startX, startY);
            ctx.rotate(angle * Math.PI / 180);
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -len);
            ctx.stroke();

            // Si las ramas son muy cortas, dibuja hojas en forma de círculos luminosos y corazones
            if (len < 10) {
                ctx.beginPath();
                ctx.arc(0, -len, 5, 0, Math.PI * 2);
                ctx.fillStyle = Math.random() > 0.5 ? '#ff65a3' : '#ffb6c1';
                ctx.fill();
                ctx.restore();
                return;
            }

            // Ramificaciones del árbol matemático
            dibujarArbol(0, -len, len * 0.78, angle + 22, branchWidth * 0.7);
            dibujarArbol(0, -len, len * 0.78, angle - 22, branchWidth * 0.7);

            ctx.restore();
        }

        function animarArbol() {
            redimensionarCanvas();
