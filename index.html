<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Feliz dia princesa :3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --pink-neon:#ff2d95;
    --pink-soft:#ff65a3;
    --pink-pastel:#ffb6c1;
    --glass-bg:rgba(255,45,149,0.07);
    --glass-border:rgba(255,101,163,0.35);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:#222222;
    overflow-x:hidden;
    width:100%;
    min-height:100%;
  }

  body{
    font-family:'Playfair Display', Georgia, 'Times New Roman', serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:38px 16px 70px;
    position:relative;
  }

  /* ---------- Lluvia de corazones de fondo ---------- */
  #heartsBg{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }

  .bg-heart{
    position:absolute;
    bottom:-40px;
    color:var(--pink-neon);
    filter: drop-shadow(0 0 6px var(--pink-neon)) drop-shadow(0 0 12px rgba(255,45,149,0.6));
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    will-change: transform, opacity;
  }

  @keyframes floatUp{
    0%{
      transform: translate(0,0) rotate(0deg);
      opacity:0;
    }
    10%{
      opacity: var(--maxOpacity, .6);
    }
    90%{
      opacity: var(--maxOpacity, .6);
    }
    100%{
      transform: translate(var(--drift,20px), -110vh) rotate(var(--rot,25deg));
      opacity:0;
    }
  }

  /* ---------- Contenido principal ---------- */
  .content{
    position:relative;
    z-index:2;
    width:100%;
    max-width:720px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .main-title{
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 400;
    font-style: italic;
    letter-spacing: 0.5px;
    color:var(--pink-neon);
    text-shadow: 0 0 18px rgba(255,101,163,0.45);
    margin: 0 0 18px;
    text-align:center;
  }

  .counter-glass{
    background: var(--glass-bg);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 16px 28px;
    box-shadow: 0 0 28px rgba(255,45,149,0.18), inset 0 0 18px rgba(255,101,163,0.08);
    font-size: clamp(1.05rem, 3.6vw, 1.5rem);
    font-weight: 600;
    text-align:center;
    color: var(--pink-pastel);
    letter-spacing: 0.4px;
    margin-bottom: 6px;
  }

  /* ---------- Árbol (canvas) ---------- */
  .tree-wrap{
    width:100%;
    max-width: 640px;
    height: min(58vw, 460px);
    min-height: 300px;
    position: relative;
    margin: 6px 0 8px;
  }

  #treeCanvas{
    width:100%;
    height:100%;
    display:block;
  }

  /* ---------- Polaroid ---------- */
  .polaroid-section{
    margin-top: 6px;
    perspective: 1200px;
    width: 100%;
    display:flex;
    justify-content:center;
  }

  .polaroid{
    background:#fdfdfa;
    padding: 18px 18px 22px;
    width: min(88vw, 320px);
    border-radius: 4px;
    box-shadow:
      0 10px 25px rgba(0,0,0,0.55),
      0 0 40px rgba(255,45,149,0.12);
    transform: rotate(-2deg);
    transition: transform 0.45s cubic-bezier(.22,1,.36,1), box-shadow 0.45s ease;
    transform-style: preserve-3d;
    cursor: pointer;
  }

  .polaroid:hover, .polaroid:focus-visible{
    transform: rotate(0deg) scale(1.04) translateY(-6px);
    box-shadow:
      0 20px 40px rgba(0,0,0,0.6),
      0 0 55px rgba(255,101,163,0.35);
  }

  .polaroid-photo-frame{
    width:100%;
    aspect-ratio: 1 / 1;
    background:#1a1a1a;
    overflow:hidden;
    border-radius: 2px;
  }

  .polaroid-photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition: opacity 0.35s ease;
  }

  .polaroid-caption{
    font-family:'Dancing Script', cursive;
    color:#3a2530;
    font-size: 1.5rem;
    text-align:center;
    margin: 14px 4px 8px;
    line-height: 1.25;
    min-height: 2.4em;
  }

  .polaroid-divider{
    border:none;
    border-top: 1.5px dotted rgba(58,37,48,0.35);
    margin: 8px 10px 10px;
  }

  .polaroid-photo-counter{
    font-family: Georgia, serif;
    font-size: 0.78rem;
    color:#7a5566;
    text-align:center;
    letter-spacing: 0.2px;
  }

  /* ---------- Botón ---------- */
  .memory-btn{
    margin-top: 34px;
    padding: 14px 34px;
    border: none;
    border-radius: 40px;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.3px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff2d95, #ff8bc4 55%, #ff65a3);
    background-size: 200% 200%;
    box-shadow: 0 0 20px rgba(255,45,149,0.55), 0 6px 18px rgba(0,0,0,0.4);
    transition: transform 0.25s ease, box-shadow 0.25s ease, background-position 0.6s ease;
  }

  .memory-btn:hover{
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 0 32px rgba(255,45,149,0.85), 0 10px 22px rgba(0,0,0,0.45);
    background-position: 100% 50%;
  }

  .memory-btn:active{
    transform: translateY(0) scale(0.97);
  }

  @media (max-width: 420px){
    .polaroid{ padding: 14px 14px 18px; }
    .counter-glass{ padding: 12px 18px; }
  }
</style>
</head>
<body>

<div id="heartsBg"></div>

<div class="content">
  <h1 class="main-title">Llevamos Juntos:</h1>
  <div class="counter-glass" id="mainCounter">Cargando…</div>

  <div class="tree-wrap">
    <canvas id="treeCanvas"></canvas>
  </div>

  <div class="polaroid-section">
    <div class="polaroid" id="polaroid" tabindex="0">
      <div class="polaroid-photo-frame">
        <img id="polaroidImg" src="" alt="Recuerdo">
      </div>
      <p class="polaroid-caption" id="polaroidCaption"></p>
      <hr class="polaroid-divider">
      <p class="polaroid-photo-counter" id="polaroidCounter"></p>
    </div>
  </div>

  <button class="memory-btn" id="memoryBtn">Ver otro recuerdo ✨</button>
</div>

<script>
/* =========================================================================
   CONFIGURACIÓN RÁPIDA — edita solo esto para personalizar el regalo
   ========================================================================= */

// Fecha en la que comenzó la relación (AAAA-MM-DDTHH:MM:SS)
const ANNIVERSARY_DATE = new Date('2024-07-08T00:00:00');

// Arreglo de recuerdos: agrega, quita o edita libremente.
// - imagen: ruta local (ej. "./imagenes/foto1.jpg") o URL
// - frase: texto manuscrito debajo de la foto
// - fecha: cuándo se tomó la foto (AAAA-MM-DDTHH:MM:SS)
const recuerdos = [
  {
    imagen: '10-09-2024.png',
    frase: '¡Recuerdas este momento?',
    fecha: '2024-09-10T11:58:00'
  },
  {
    imagen: '31-05-2026.png',
    frase: 'en esta foto etsmos en el McDonalds :0',
    fecha: '2026-05-31T22:17:00'
  },
  {
    imagen: 'WhatsApp Image 2026-07-29 at 19.44.18 (1).png',
    frase: 'El viaje que nunca olvidaremos ',
    fecha: '2026-02-15T21:04:00'
  },
  {
    imagen: '15-02-2026.png',
    frase: 'Un abrazo que quiero repetir siempre ',
    fecha: '2026-02-15T21:01:00'
  }
];

/* ========================= FIN DE LA CONFIGURACIÓN ===================== */


/* -------------------------------------------------------------------------
   1. Lluvia de corazones de fondo
------------------------------------------------------------------------- */
const heartsBg = document.getElementById('heartsBg');

function spawnHeart(){
  const heart = document.createElement('div');
  heart.className = 'bg-heart';
  heart.textContent = '💗';

  const size = 8 + Math.random() * 16;          // tamaño aleatorio
  const left = Math.random() * 100;              // posición horizontal
  const duration = 7 + Math.random() * 8;        // velocidad de subida
  const drift = (Math.random() * 140 - 70) + 'px';
  const rot = (Math.random() * 60 - 30) + 'deg';
  const maxOpacity = 0.25 + Math.random() * 0.45;

  heart.style.left = left + 'vw';
  heart.style.fontSize = size + 'px';
  heart.style.setProperty('--drift', drift);
  heart.style.setProperty('--rot', rot);
  heart.style.setProperty('--maxOpacity', maxOpacity);
  heart.style.animationDuration = duration + 's';

  heartsBg.appendChild(heart);
  setTimeout(() => heart.remove(), duration * 1000 + 200);
}

// Densidad suave: un corazón nuevo cada intervalo aleatorio
function heartLoop(){
  spawnHeart();
  setTimeout(heartLoop, 550 + Math.random() * 650);
}
heartLoop();


/* -------------------------------------------------------------------------
   2. Contador principal en tiempo real
------------------------------------------------------------------------- */
function formatElapsed(fromDate){
  let diff = Date.now() - fromDate.getTime();
  if (diff < 0) diff = 0;

  const seconds = Math.floor(diff / 1000) % 60;
  const minutes = Math.floor(diff / (1000 * 60)) % 60;
  const hours   = Math.floor(diff / (1000 * 60 * 60)) % 24;
  const days    = Math.floor(diff / (1000 * 60 * 60 * 24));

  return `${days} días, ${hours}h, ${minutes}m y ${seconds}s`;
}

function updateMainCounter(){
  document.getElementById('mainCounter').textContent = formatElapsed(ANNIVERSARY_DATE);
}
updateMainCounter();
setInterval(updateMainCounter, 1000);


/* -------------------------------------------------------------------------
   3. Árbol de amor fractal — Canvas 2D
------------------------------------------------------------------------- */
const canvas = document.getElementById('treeCanvas');
const ctx = canvas.getContext('2d');
const treeWrap = document.querySelector('.tree-wrap');

let W = 0, H = 0, DPR = 1;

function resizeCanvas(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = treeWrap.clientWidth;
  H = treeWrap.clientHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);

const PARTICLE_COLORS = ['#ff65a3', '#ffb6c1', '#ff2d95', '#ffd1e0'];

// pseudo-aleatorio estable (misma "forma" de árbol en cada frame)
function pseudoRandom(seed){
  const x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

let MAX_LEVEL = W < 480 ? 6 : 7;

function drawTip(x, y, angle, seed, time){
  const pulse = 0.55 + 0.45 * Math.sin(time * 0.003 + seed * 6.28);
  const color = PARTICLE_COLORS[Math.floor(pseudoRandom(seed * 3.1) * PARTICLE_COLORS.length)];
  const useHeart = pseudoRandom(seed * 7.7) > 0.45;
  const size = 3 + pseudoRandom(seed * 5.3) * 3.5;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.shadowColor = color;
  ctx.shadowBlur = 14 + pulse * 10;
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.65 + pulse * 0.35;

  if (useHeart){
    const s = size * 1.1;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.35);
    ctx.bezierCurveTo(-s, -s * 0.6, -s * 0.2, -s * 1.3, 0, -s * 0.4);
    ctx.bezierCurveTo(s * 0.2, -s * 1.3, s, -s * 0.6, 0, s * 0.35);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(0, 0, size * pulse, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function branch(x, y, len, angle, level, seedPath, time){
  if (len < 3 || level > MAX_LEVEL){
    return;
  }

  // el viento afecta más cuanto más lejos del tronco (nivel alto)
  const windStrength = level * 0.045;
  const sway = Math.sin(time * 0.0016 + level * 0.6 + seedPath * 3.14) * windStrength;
  const a = angle + sway;

  const x2 = x + len * Math.sin(a);
  const y2 = y - len * Math.cos(a);

  // color y grosor: tronco elegante -> ramas finas rosadas
  const t = level / MAX_LEVEL;
  const r = Math.round(58 + t * (255 - 58));
  const g = Math.round(14 + t * (45 - 14));
  const b = Math.round(38 + t * (110 - 38));

  ctx.strokeStyle = `rgb(${r},${g},${b})`;
  ctx.lineWidth = Math.max(1, (MAX_LEVEL - level + 1) * 1.7);
  ctx.lineCap = 'round';

  if (level > MAX_LEVEL - 2){
    ctx.shadowColor = 'rgba(255,101,163,0.55)';
    ctx.shadowBlur = 6;
  } else {
    ctx.shadowBlur = 0;
  }

  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  if (level === MAX_LEVEL){
    drawTip(x2, y2, a, seedPath, time);
    return;
  }

  const branchAngle = 0.42 + pseudoRandom(seedPath * 9.1 + level) * 0.16;
  const lenFactor = 0.7 + pseudoRandom(seedPath * 4.4 + level) * 0.08;

  branch(x2, y2, len * lenFactor, a - branchAngle, level + 1, seedPath * 2 + 1, time);
  branch(x2, y2, len * lenFactor, a + branchAngle, level + 1, seedPath * 2 + 2, time);

  // rama extra ocasional para densidad orgánica
  if (level > 1 && level < MAX_LEVEL - 1 && pseudoRandom(seedPath * 6.6 + level) > 0.72){
    branch(x2, y2, len * lenFactor * 0.85, a + sway * 0.4, level + 2, seedPath * 2 + 3, time);
  }
}

function drawTree(time){
  ctx.clearRect(0, 0, W, H);

  const baseX = W / 2;
  const baseY = H - Math.min(18, H * 0.04);
  const trunkLen = Math.min(H, W) * 0.30;

  branch(baseX, baseY, trunkLen, 0, 0, 1, time);
}

function animateTree(time){
  drawTree(time);
  requestAnimationFrame(animateTree);
}
requestAnimationFrame(animateTree);


/* -------------------------------------------------------------------------
   4. Polaroid — recuerdo actual + contador de la foto
------------------------------------------------------------------------- */
const polaroidImg = document.getElementById('polaroidImg');
const polaroidCaption = document.getElementById('polaroidCaption');
const polaroidCounter = document.getElementById('polaroidCounter');
const polaroid = document.getElementById('polaroid');

let currentIndex = 0;
let currentPhotoDate = null;

function renderMemory(index){
  const m = recuerdos[index];
  currentIndex = index;
  currentPhotoDate = new Date(m.fecha);

  polaroidImg.style.opacity = 0;
  setTimeout(() => {
    polaroidImg.src = m.imagen;
    polaroidImg.alt = m.frase;
    polaroidImg.style.opacity = 1;
  }, 180);

  polaroidCaption.textContent = m.frase;
  updatePhotoCounter();
}

function updatePhotoCounter(){
  if (!currentPhotoDate) return;
  polaroidCounter.textContent = 'Esta foto fue hace: ' + formatElapsed(currentPhotoDate);
}

setInterval(updatePhotoCounter, 1000);
renderMemory(0);

// Suave tilt 3D al mover el mouse sobre la polaroid (efecto flotar)
polaroid.addEventListener('mousemove', (e) => {
  const rect = polaroid.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width - 0.5;
  const py = (e.clientY - rect.top) / rect.height - 0.5;
  polaroid.style.transform =
    `rotate(0deg) scale(1.04) translateY(-6px) rotateX(${(-py * 8).toFixed(2)}deg) rotateY(${(px * 8).toFixed(2)}deg)`;
});
polaroid.addEventListener('mouseleave', () => {
  polaroid.style.transform = '';
});


/* -------------------------------------------------------------------------
   5. Botón "Ver otro recuerdo" — elige un recuerdo al azar
------------------------------------------------------------------------- */
document.getElementById('memoryBtn').addEventListener('click', () => {
  if (recuerdos.length <= 1){
    renderMemory(0);
    return;
  }
  let next;
  do {
    next = Math.floor(Math.random() * recuerdos.length);
  } while (next === currentIndex);
  renderMemory(next);
});
</script>
</body>
</html>
