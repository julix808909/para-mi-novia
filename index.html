<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Novia ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #050005;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #ff65a3;
            overflow-x: hidden;
            position: relative;
        }

        h1 {
            font-size: 1.8rem;
            margin: 10px 0 5px 0;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(255, 101, 163, 0.7);
            z-index: 10;
        }

        .contador-principal {
            background: rgba(255, 101, 163, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            box-shadow: 0 0 25px rgba(255, 101, 163, 0.25);
            border: 1px solid rgba(255, 101, 163, 0.35);
            text-align: center;
            z-index: 10;
            color: #fff;
        }

        #contenedor-arbol {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 380px;
            z-index: 5;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .marco-foto {
            background: #ffffff;
            padding: 16px 16px 36px 16px;
            border-radius: 2px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 101, 163, 0.1);
            max-width: 290px;
            width: 82%;
            text-align: center;
            transform: rotate(-1.5deg);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 10;
            margin-top: 5px;
        }

        .marco-foto::before {
            content: "";
            position: absolute;
            top: -15px;
            left: 35%;
            width: 80px;
            height: 25px;
            background-color: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(3px);
            transform: rotate(-4deg);
            border-left: 2px dashed rgba(255, 101, 163, 0.2);
            border-right: 2px dashed rgba(255, 101, 163, 0.2);
        }

        .marco-foto:hover {
            transform: rotate(0deg) scale(1.04);
            box-shadow: 0 20px 45px rgba(255, 101, 163, 0.4);
        }

        .marco-foto img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 1px;
            background-color: #111;
        }

        .texto-foto {
            margin-top: 15px;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 1.05rem;
            color: #222;
            line-height: 1.3;
            font-weight: bold;
        }

        .contador-foto {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #555;
            border-top: 1px dotted #ffccd5;
            padding-top: 8px;
            font-weight: normal;
        }

        .btn-cambiar {
            margin-top: 20px;
            background: linear-gradient(135deg, #ff65a3 0%, #d63384 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(214, 51, 132, 0.5);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .btn-cambiar:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 101, 163, 0.8);
        }

        .corazon-flotante {
            position: absolute;
            color: rgba(255, 101, 163, 0.25);
            pointer-events: none;
            animation: lluviaAmor 6s linear infinite;
            z-index: 1;
        }

        @keyframes lluviaAmor {
            0% { transform: translateY(105vh) scale(0.5) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>Llevamos Juntos:</h1>
    <div class="contador-principal" id="tiempoJuntos">Calculando tiempo...</div>
    
    <div id="contenedor-arbol">
        <canvas id="canvasArbol"></canvas>
    </div>

    <div class="marco-foto">
        <img id="fotoNovia" src="" alt="Nuestro momento">
        <div id="textoNovia" class="texto-foto">Cargando recuerdo...</div>
        <div id="tiempoFoto" class="contador-foto"></div>
    </div>

    <button class="btn-cambiar" onclick="mostrarRecuerdoAleatorio()">Ver otro recuerdo ✨</button>

    <script>
        const fechaInicioRelacion = new Date("2024-05-15T00:00:00"); 

        const recuerdos = [
            {
                url: "./imagenes/mcdonalds.png", 
                texto: "La foto de hoy es... de cuando fuimos al McDonalds 🍦",
                fechaFoto: new Date("2024-07-20T16:30:00")
            },
            {
                url: "./imagenes/foto2.png", 
                texto: "Esta foto fue hace... en nuestro viaje favorito ✈️",
                fechaFoto: new Date("2025-01-10T12:00:00")
            }
        ];

        let recuerdoActual = null;

        function calcularTiempoTranscurrido(fechaPasada) {
            const ahora = new Date();
            const diferenciaMs = ahora - fechaPasada;
            if (diferenciaMs < 0) return "¡Fecha en el futuro!";
            const dias = Math.floor(diferenciaMs / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferenciaMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferenciaMs % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diferenciaMs % (1000 * 60)) / 1000);
            return `${dias} días, ${horas}h, ${minutos}m y ${segundos}s`;
        }

        function actualizarContadores() {
            document.getElementById("tiempoJuntos").innerText = calcularTiempoTranscurrido(fechaInicioRelacion);
            if (recuerdoActual && recuerdoActual.fechaFoto) {
                document.getElementById("tiempoFoto").innerText = `📸 Esta foto fue hace: ${calcularTiempoTranscurrido(recuerdoActual.fechaFoto)}`;
            }
        }

        function mostrarRecuerdoAleatorio() {
            const indiceAleatorio = Math.floor(Math.random() * recuerdos.length);
            recuerdoActual = recuerdos[indiceAleatorio];
            document.getElementById('fotoNovia').src = recuerdoActual.url;
            document.getElementById('textoNovia').innerText = recuerdoActual.texto;
            actualizarContadores();
        }

        function crearCorazonFondo() {
            const corazon = document.createElement('div');
            corazon.classList.add('corazon-flotante');
            corazon.innerText = ['❤️','💖','💝','💕','🌸'][Math.floor(Math.random() * 5)];
            corazon.style.left = Math.random() * 100 + 'vw';
            corazon.style.animationDuration = (Math.random() * 3 + 4) + 's';
            corazon.style.fontSize = (Math.random() * 16 + 14) + 'px';
            document.body.appendChild(corazon);
            setTimeout(() => { corazon.remove(); }, 6000);
        }
        setInterval(crearCorazonFondo, 300);

        const canvas = document.getElementById('canvasArbol');
        const ctx = canvas.getContext('2d');
        let ramificaciones = [];

        function redimensionarCanvas() {
            const contenedor = document.getElementById('contenedor-arbol');
            canvas.width = contenedor.clientWidth;
            canvas.height = contenedor.clientHeight;
        }

        function crearEstructuraArbol(startX, startY, len, angle, branchWidth) {
            ramificaciones.push({
                startX, startY,
                endX: startX + Math.sin(angle * Math.PI / 180) * len,
                endY: startY - Math.cos(angle * Math.PI / 180) * len,
                len, angle, branchWidth
            });

            if (len < 12) return;

            crearEstructuraArbol(ramificaciones[ramificaciones.length-1].endX, ramificaciones[ramificaciones.length-1].endY, len * 0.76, angle + 24, branchWidth * 0.7);
            crearEstructuraArbol(ramificaciones[ramificaciones.length-1].endX, ramificaciones[ramificaciones.length-1].endY, len * 0.76, angle - 20, branchWidth * 0.7);
        }

        let timeFactor = 0;
        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            timeFactor += 0.04;

            ramificaciones.forEach(branch => {
                ctx.beginPath();
                ctx.save();
                ctx.strokeStyle = "#2b1424";
                ctx.lineWidth = branch.branchWidth;
                ctx.lineCap = "round";
                
                let wind = branch.len < 25 ? Math.sin(timeFactor + branch.startX) * 1.5 : 0;

                ctx.moveTo(branch.startX, branch.startY);
                ctx.lineTo(branch.endX + wind, branch.endY);
                ctx.stroke();

                if (branch.len < 15) {
                    ctx.beginPath();
                    ctx.shadowColor = "rgba(255, 101, 163, 0.8)";
                    ctx.shadowBlur = 8;
                    ctx.arc(branch.endX + wind, branch.endY, 4.5, 0, Math.PI * 2);
                    ctx.fillStyle = branch.len < 10 ? '#ff65a3' : '#ffb6c1';
                    ctx.fill();
                }
                ctx.restore();
            });

            requestAnimationFrame(renderLoop);
        }

        function inicializarArbol() {
            redimensionarCanvas();
            ramificaciones = [];
            crearEstructuraArbol(canvas.width / 2, canvas.height - 5, 80, 0, 7.5);
        }

        setInterval(actualizarContadores, 1000);
        window.addEventListener('resize', () => { inicializarArbol(); });

        window.onload = () => {
            mostrarRecuerdoAleatorio();
            inicializarArbol();
            requestAnimationFrame(renderLoop);
        };
    </script>
</body>
</html>
